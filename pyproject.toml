[project]
name = "rigid-body-manipulation"
version = "0.1"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "mujoco",
    "dm_control",
    "tqdm",
    "omegaconf",
    "transforms3d",
    "liegroups @ git+https://github.com/utiasSTARS/liegroups.git@refs/pull/10/head",
    "tyro",
    "ruff",
    "opencv-python>=4.11.0.86",
    "pyqt6>=6.9.0",
]

[project.scripts]
generate-trajectory = "trajectories.generate:main"
merge-datasets = "recorders.merge:main"
export-dynamics-csv = "recorders.export_dynamics_csv:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.ruff]
line-length = 119 # 行の最大文字数
select = [ # 有効にするルール
    "E",    # pycodestyle のエラー
    "W",    # pycodestyle の警告
    "F",    # pyflakes のエラー
    "I",    # isort のエラー
    "C",    # mccabe の複雑性
    "B",    # flake8-bugbear のバグ
    "UP",   # pyupgrade
    "Q",    # ruff特有のルール
]
ignore = [ # 無視するルール
    "E501", # 行が長すぎる (line-length で管理)
]
#exclude = [ # 除外するファイル/ディレクトリ
#    ".venv",
#    "tests",
#    "docs",
#]
target-version = "py312" # ターゲットの Python バージョン
#src = ["src", "."] # ソースディレクトリ
fix = true # 自動修正を有効にする
unsafe-fixes = false # 安全でない修正も有効にする

[tool.setuptools.packages.find]
include = [
    "controllers",
    "dynamics",
    "factory",
    "omegaconf_custom_resolvers",
    "recorders",
    "regressions",
    "sensors",
    "simulators",
    "trajectories",
    "transformations",
    "utilities",
    "visualization",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
rigid-body-manipulation = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

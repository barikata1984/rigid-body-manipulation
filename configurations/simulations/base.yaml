manipulator: xml_models/manipulators/sequential
reset_keyframe: initial_state
noise_profile: empirical
control_noise: true
control_derived_velocity: false
record_noise: true
record_joint_noise: true
record_wrench_noise: true
translation_noise_scale: 1.0
rotation_noise_scale: 1.0
recorder:
  target_class: StandardRecorder
  track_cam_name: tracking
  fig_height: 800
  fig_width: 800
  videoname: output.mp4
  videcodec: mp4v
controller:
  target_class: LinearQuadraticRegulator
  state_space:
    epsilon: 0.002
    centered: true
  state_gain:
  # qpos
  - 1000000
  - 1000000
  - 1000000
  - 1000
  - 1000
  - 1000
  # qvel
  - 10000
  - 10000
  - 10000
  - 10
  - 10
  - 10
  input_gain:
  - 0.01
  - 0.01
  - 0.01
  - 0.1
  - 0.1
  - 0.1